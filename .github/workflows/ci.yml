name: CI

on:
  push:
    branches:
      - main
      - master
      - 'arena/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux job: web build + full Go verification (gofmt, build, vet, test).
  web-and-go-linux:
    name: Linux — web + Go
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The web build MUST run before any Go compilation: internal/server
      # embeds internal/server/webassets via //go:embed, and the SPA tests
      # need a real index.html inside the embed tree. npm ci (not npm
      # install) installs exactly the locked dependencies. `npm run build`
      # already runs `tsc --noEmit && vite build`, so no separate
      # typecheck step is needed.
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build web UI (includes TypeScript check)
        working-directory: web
        run: npm run build

      - name: Verify embedded web assets
        run: test -f internal/server/webassets/index.html

      - name: Gofmt check
        shell: bash
        run: |
          out="$(git ls-files -z -- '*.go' | xargs -0 gofmt -l)"
          if [ -n "$out" ]; then
            echo "These files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Build Go
        run: go build ./...

      - name: Vet Go
        run: go vet ./...

      - name: Test Go
        run: go test ./... -count=1

  # Windows job: the exact verification that caught the Windows-only issues
  # (POSIX permission bits, control-key bytes, embedded-asset serving). It
  # is independent of the Linux job so a failure on either OS is diagnosed
  # in its own log.
  windows:
    name: Windows — web + Go
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build web UI (includes TypeScript check)
        working-directory: web
        run: npm run build

      - name: Verify embedded web assets
        shell: bash
        run: test -f internal/server/webassets/index.html

      - name: Build Go
        run: go build ./...

      - name: Test Go
        run: go test ./... -count=1

      - name: Vet Go
        run: go vet ./...

  # Landing page job: the static marketing site under landing-page/ is its
  # own Cloudflare Pages project. This job only sanity-checks those static
  # files — no Go, no web/ build, no coupling to the embedded frontend.
  landing-page:
    name: Landing page — static sanity
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify entrypoint and required files
        run: |
          set -euo pipefail
          test -f landing-page/index.html
          for f in styles.css script.js assets/favicon.svg; do
            test -f "landing-page/$f" || { echo "missing landing-page/$f"; exit 1; }
          done

      - name: Static-site sanity check
        run: |
          set -euo pipefail
          # Well-formed HTML (tag balance) and every local asset referenced
          # from index.html must exist. Python stdlib only.
          python3 - <<'PY'
          import html.parser, os, re, sys
          root = 'landing-page'
          class Checker(html.parser.HTMLParser):
              VOID = {'area','base','br','col','embed','hr','img','input',
                      'link','meta','source','track','wbr'}
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack, self.errors = [], []
              def handle_starttag(self, tag, attrs):
                  if tag not in self.VOID:
                      self.stack.append(tag)
              def handle_endtag(self, tag):
                  if tag in self.VOID:
                      return
                  if self.stack and self.stack[-1] == tag:
                      self.stack.pop()
                  elif tag in self.stack:
                      while self.stack and self.stack[-1] != tag:
                          self.errors.append('unclosed <%s>' % self.stack.pop())
                      self.stack.pop()
                  else:
                      self.errors.append('stray </%s>' % tag)
          with open(os.path.join(root, 'index.html'), encoding='utf-8') as fh:
              html_text = fh.read()
          c = Checker()
          c.feed(html_text)
          c.close()
          errors = c.errors + ['unclosed <%s> at EOF' % t for t in c.stack]
          missing = []
          for ref in set(re.findall(r'(?:src|href)="([^"]+)"', html_text)):
              if ref.startswith(('http://', 'https://', 'mailto:', '#', 'data:')):
                  continue
              path = ref.split('#')[0].split('?')[0]
              if path.startswith('./'):
                  path = path[2:]
              if path and not os.path.isfile(os.path.join(root, path)):
                  missing.append(ref)
          if errors or missing:
              for e in errors:
                  print('HTML error:', e)
              for m in missing:
                  print('Missing local asset:', m)
              sys.exit(1)
          print('landing-page: HTML tag balance OK, all local assets present')
          PY
          # Isolation: the marketing site must stay framework/Go-free.
          # (grep the actual code files only — not prose in README.md)
          if grep -rn 'go:embed' landing-page; then
            echo "landing-page must not contain go:embed"
            exit 1
          fi
          if grep -nE "from ['\"]react['\"]|require\(['\"]react['\"]\)|/@vite|/@fs" \
              landing-page/index.html landing-page/script.js; then
            echo "landing-page must not reference React or Vite dev-server paths"
            exit 1
          fi
          if test -f landing-page/package.json || test -d landing-page/node_modules; then
            echo "landing-page must have no build system (package.json/node_modules)"
            exit 1
          fi
          echo "landing-page isolation checks passed"

      - name: Set up Node (static checks only)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax check
        run: node --check landing-page/script.js
