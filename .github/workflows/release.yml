name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    name: Build binaries & publish release
    runs-on: ubuntu-latest

    steps:
      # Resolve and validate the tag BEFORE checkout so a manual run
      # builds the requested tag, never the default branch.
      - name: Resolve and validate release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # Expected format: vMAJOR.MINOR.PATCH (optionally with a
          # pre-release/build suffix, e.g. v1.0.0-rc.1).
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid release tag '$TAG' (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release: tag=$TAG  version=$VERSION  commit=${GITHUB_SHA}"

      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          # For a tag push this is the tag itself; for workflow_dispatch it
          # forces the requested tag instead of whatever ref the dispatch
          # happened on. fetch-depth 0 makes the annotated tag resolvable.
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ---- verification: nothing is published until all of this passes ----
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build web UI (includes TypeScript check)
        working-directory: web
        run: npm run build

      - name: Verify embedded web assets
        run: test -f internal/server/webassets/index.html

      - name: Test Go
        run: go test ./... -count=1

      - name: Vet Go
        run: go vet ./...

      - name: Build Go
        run: go build ./...

      # ---- artifacts ----
      - name: Cross-compile binaries with version metadata
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-X remorasftp/internal/version.Version=${VERSION} \
                   -X remorasftp/internal/version.Commit=${COMMIT} \
                   -X remorasftp/internal/version.BuildTime=${BUILD_TIME} \
                   -s -w"
          MAIN=./cmd/remorasftp

          mkdir -p dist
          build() { GOOS="$1" GOARCH="$2" go build -trimpath -ldflags "$LDFLAGS" -o "dist/$3" "$MAIN"; }

          build linux   amd64 remorasftp
          tar -C dist -czf dist/remorasftp-linux-amd64.tar.gz   remorasftp && rm dist/remorasftp
          build darwin  amd64 remorasftp
          tar -C dist -czf dist/remorasftp-macos-amd64.tar.gz   remorasftp && rm dist/remorasftp
          build darwin  arm64 remorasftp
          tar -C dist -czf dist/remorasftp-macos-arm64.tar.gz   remorasftp && rm dist/remorasftp
          build windows amd64 remorasftp.exe
          (cd dist && zip -q remorasftp-windows-amd64.zip remorasftp.exe) && rm dist/remorasftp.exe

          (cd dist && sha256sum remorasftp-*.tar.gz remorasftp-*.zip > checksums.txt)
          ls -lh dist

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=(
            dist/remorasftp-linux-amd64.tar.gz
            dist/remorasftp-macos-amd64.tar.gz
            dist/remorasftp-macos-arm64.tar.gz
            dist/remorasftp-windows-amd64.zip
            dist/checksums.txt
          )
          NOTES="RemoraSFTP ${TAG} - commit ${COMMIT}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - replacing assets…"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "Creating release $TAG…"
            gh release create "$TAG" --title "RemoraSFTP $TAG" --notes "$NOTES" "${ASSETS[@]}"
          fi
